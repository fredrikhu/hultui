# Builds the trimmed LGPL libmpv for HultUI.Media.Mpv (native/mpv/README.md), proves
# it with the backend tests, and packs HultUI.Media.Mpv.Natives.
#
# Runs on the self-hosted runners (docs/SELF-HOSTED-RUNNERS.md). The Windows runner
# needs an MSYS2 with the MINGW64 packages the README lists; MSYS2_ROOT says where
# (default C:\msys64). The Ubuntu runner needs the apt packages the README lists.
#
# Tags only, plus workflow_dispatch: a native build is half an hour of runner time
# and the result changes only when versions.env does.

name: mpv natives

on:
  push:
    tags: ['mpv-natives-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mpv-natives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: [self-hosted, windows, x64]
    env:
      MSYS2_ROOT: ${{ vars.MSYS2_ROOT || 'C:\msys64' }}
    steps:
      - uses: actions/checkout@v5

      - name: Build libmpv (MSYS2 MINGW64)
        shell: pwsh
        run: |
          $env:MSYSTEM = 'MINGW64'
          $env:CHERE_INVOKING = '1'
          & "$env:MSYS2_ROOT\usr\bin\bash.exe" -lc "cd '$PWD/native/mpv' && bash ./build-libmpv.sh"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prove it with the backend tests
        shell: pwsh
        run: |
          $env:HULTUI_MPV_PATH = "$PWD\native\mpv\out\win-x64\libmpv-2.dll"
          $env:HULTUI_MPV_EXPECT_LGPL = '1'
          dotnet test tests/HultUI.Media.Backends.Tests -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-win-x64
          path: native/mpv/out/win-x64/

  linux:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      # The runner account is unprivileged (docs/SELF-HOSTED-RUNNERS.md). With
      # passwordless sudo the packages install themselves; without it, the job says
      # what to install and stops before spending half an hour to find out.
      - name: Build dependencies
        run: |
          pkgs="build-essential git meson ninja-build nasm pkg-config python3 python3-jinja2 autoconf automake libtool \
                libfreetype-dev libfribidi-dev libharfbuzz-dev libfontconfig-dev libdav1d-dev zlib1g-dev \
                libasound2-dev libpulse-dev libgl-dev"
          if sudo -n true 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq $pkgs
          else
            missing=""
            for p in $pkgs; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
            if [ -n "$missing" ]; then
              echo "::error::Missing packages on this runner and no passwordless sudo. Install as root: apt install -y$missing"
              exit 1
            fi
          fi

      - name: Build libmpv
        run: cd native/mpv && bash ./build-libmpv.sh

      - name: Prove it with the backend tests
        run: HULTUI_MPV_PATH="$PWD/native/mpv/out/linux-x64/libmpv.so.2" HULTUI_MPV_EXPECT_LGPL=1 dotnet test tests/HultUI.Media.Backends.Tests -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-linux-x64
          path: native/mpv/out/linux-x64/

  package:
    needs: [windows, linux]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: libmpv-win-x64
          path: native/mpv/out/win-x64

      - uses: actions/download-artifact@v4
        with:
          name: libmpv-linux-x64
          path: native/mpv/out/linux-x64

      # Tag mpv-natives-v1.2.0 -> 1.2.0; a dispatch build gets a prerelease stamp.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mpv-natives-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/mpv-natives-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/HultUI.Media.Mpv.Natives/HultUI.Media.Mpv.Natives.csproj -c Release -o artifacts/packages -p:Version=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: HultUI.Media.Mpv.Natives
          path: artifacts/packages/*.nupkg

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/mpv-natives-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" artifacts/packages/*.nupkg \
            native/mpv/out/win-x64/libmpv-2.dll native/mpv/out/win-x64/LICENCE-REPORT.txt \
            native/mpv/out/linux-x64/libmpv.so.2 native/mpv/out/linux-x64/LICENCE-REPORT.txt \
            --title "libmpv natives ${{ steps.version.outputs.version }}" \
            --notes "Trimmed LGPL-2.1 libmpv for HultUI.Media.Mpv. See native/mpv/README.md and each LICENCE-REPORT.txt."
