# Packs CEF for Debian and Ubuntu: HultUI.WebView.Cef.Natives.<rid>, one package per RID
# (native/cef/README.md). It fetches CEF's official minimal distribution for the version
# native/cef/versions.env pins, checks its SHA-1, flattens and strips it, proves linux-x64 with
# the engine tests running on it, and only then packs both RIDs and publishes them to a GitHub
# release, as the mpv natives do (scripts/release-transport.sh: a tag run uses its own release,
# a dispatch run the rolling "cef-natives-ci" prerelease, from which older builds are pruned).
#
# One job, not a job per RID: arm64 cannot be tested here, so it waits on linux-x64's proof
# (the same CEF version and build, another architecture). As two jobs, arm64 published from
# runs whose linux-x64 tests had failed.
#
# GitHub-hosted runners only (docs/CI.md). Tags only, plus workflow_dispatch: the result
# changes only when versions.env does.
name: cef natives

on:
  push:
    tags: ['cef-natives-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cef-natives-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/cef-natives-v') && github.ref_name || 'cef-natives-ci' }}
  RELEASE_KIND: ${{ startsWith(github.ref, 'refs/tags/cef-natives-v') && '' || '--prerelease' }}

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the packages go to the release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # build.sh: bzip2 to unpack, and a strip that reads each RID's ELF. The engine tests:
      # CEF's own libraries (the ones an application's .deb declares;
      # src/HultUI.WebView.Cef.Natives/README.md), Mesa to render in software, and a C
      # compiler for hultui-cef-helper. The image has most of these already.
      - name: Install what the build and the engine tests need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl bzip2 binutils binutils-aarch64-linux-gnu build-essential \
            libnspr4 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libasound2t64 \
            libglib2.0-0t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxkbcommon0 libpango-1.0-0 \
            libcairo2 libgbm1 libegl1 libgl1 libegl-mesa0 libgl1-mesa-dri

      - name: Fetch, check, flatten and strip CEF for linux-x64
        run: native/cef/build.sh linux-x64

      # The engine tests skip, rather than fail, where CEF cannot start, and an early run here
      # skipped all 53 that need it while reporting success: so say what the runner lacks first,
      # and fail afterwards if those tests did not run.
      - name: What CEF needs that the runner lacks
        run: |
          missing=$(ldd native/cef/out/linux-x64/cef/libcef.so | grep 'not found' || true)
          if [ -n "$missing" ]; then
            echo "::warning::libcef.so cannot load on this runner; install what provides:"
            echo "$missing"
          fi
          command -v cc >/dev/null || echo "::warning::No C compiler (cc): hultui-cef-helper cannot be built, and the engine reports itself unavailable."

      # The engine's own tests, on the packaged CEF rather than any the runner has.
      - name: Prove it with the engine tests
        run: |
          HULTUI_CEF_DIR="$PWD/native/cef/out/linux-x64/cef" dotnet test tests/HultUI.WebView.Engines.Tests -c Release \
            --logger "console;verbosity=detailed" 2>&1 | tee engine-tests.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -q "Skipped HultUI.WebView.Engines.Tests.CefEngineTests.WithCef_TheEngineIsAvailable" engine-tests.log; then
            echo "::error::The tests that need CEF were skipped, so this proved nothing about the package. The step above says what the runner lacks."
            exit 1
          fi

      - name: Fetch, check, flatten and strip CEF for linux-arm64
        run: native/cef/build.sh linux-arm64

      # Tag cef-natives-v1.2.0 -> 1.2.0; a dispatch build gets a prerelease stamp. The
      # version reaches a command line below, so a tag that does not hold one stops here.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cef-natives-v* ]]; then
            version=${GITHUB_REF#refs/tags/cef-natives-v}
          else
            version=0.0.0-ci.$GITHUB_RUN_NUMBER
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for rid in linux-x64 linux-arm64; do
            dotnet pack src/HultUI.WebView.Cef.Natives/HultUI.WebView.Cef.Natives.csproj -c Release -o artifacts/packages \
              -p:Rid=$rid "-p:Version=$VERSION"
          done

      # Each upload replaces an asset of the same name; a rolling release's older builds have
      # other names (the version is in them), so they are pruned, or each run added 300 MB.
      - name: Publish the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-transport.sh ensure "$RELEASE_TAG" $RELEASE_KIND
          for rid in linux-x64 linux-arm64; do
            for f in artifacts/packages/HultUI.WebView.Cef.Natives.$rid.*.nupkg; do
              bash scripts/release-transport.sh upload "$RELEASE_TAG" "$f" "$(basename "$f")"
              bash scripts/release-transport.sh prune "$RELEASE_TAG" "HultUI.WebView.Cef.Natives.$rid." "$(basename "$f")"
            done
          done
