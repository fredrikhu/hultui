# Builds the Aperture Windows installer.
#
# Runs on release tags only. Pushing a tag like `aperture-v1.2.0` builds the installer
# and publishes a GitHub Release with it attached. Push at most three tags in one
# `git push`: GitHub fires no push events for a larger one, so no release starts
# (recover with `gh workflow run aperture-installer.yml --ref <tag>`).
#
# GitHub-hosted runners only (docs/CI.md). Use `workflow_dispatch` for an off-tag
# build — it still produces a CI-versioned installer as an artifact, without
# publishing a release.

name: Aperture installer

on:
  push:
    tags: ['aperture-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aperture-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # The trimmed LGPL libmpv the player decodes with: an asset of this repository's
  # mpv-natives release (mpv-natives.yml). A rolling prerelease; pin it to an
  # `mpv-natives-v*` tag when one is cut.
  MPV_TAG: mpv-natives-ci

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build app (Release)
        run: dotnet build apps/Aperture/Aperture/Aperture.csproj -c Release

      - name: Run tests
        run: dotnet test tests/Aperture.Tests/Aperture.Tests.csproj -c Release

      # Aperture draws through HultUI's Skia pipeline and plays through HultUI.Media,
      # so a framework regression breaks it even when its own tests pass. These gate
      # the release on both.
      - name: Run framework render and media tests (headless)
        run: |
          dotnet test tests/HultUI.Headless.Tests/HultUI.Headless.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/HultUI.Media.Tests/HultUI.Media.Tests.csproj -c Release

  installer:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write # for the release step on tag builds
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Tag aperture-v1.2.0 -> 1.2.0; other builds get a CI prerelease version. The
      # version reaches command lines below, so a tag that does not hold one stops here.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/aperture-v*') {
            $version = $env:GITHUB_REF_NAME.Substring('aperture-v'.Length)
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $version"

      # Native AOT publish (PublishAot is set in the csproj); the runner image
      # includes the required MSVC toolchain.
      - name: Publish Aperture (win-x64, AOT)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish apps/Aperture/Aperture/Aperture.csproj -c Release -r win-x64 "-p:Version=$env:VERSION"

      # libmpv is not a NuGet dependency: the trimmed LGPL build lives as an asset of
      # the natives release. It goes into the publish folder so the installer picks it
      # up like any other native library, with its licence report beside it — shipping
      # it is what brings the LGPL obligations, and the report is how they are met.
      - name: Fetch libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $publish = "apps/Aperture/Aperture/bin/Release/net10.0/win-x64/publish"
          # The transport is called as the Python it is. "python3" on a Windows PATH can be
          # the Store's stub, which does nothing and exits, so each candidate is tried.
          $py = $null
          foreach ($candidate in 'python3', 'python') {
            if (Get-Command $candidate -ErrorAction SilentlyContinue) {
              & $candidate -c 'pass' *> $null
              if ($LASTEXITCODE -eq 0) { $py = $candidate; break }
            }
          }
          if (-not $py) { throw 'no working python found' }

          & $py scripts/release_transport.py download $env:MPV_TAG libmpv-2.dll "$publish/libmpv-2.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py scripts/release_transport.py download $env:MPV_TAG LICENCE-REPORT-win-x64.txt "$publish/LICENCE-mpv.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" apps\Aperture\Installer\aperture.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A convenience copy, kept briefly: the release step attaches the installer from the
      # workspace, so a failed upload (the account's artifact quota) must not stop it.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: Aperture-Setup-${{ steps.version.outputs.version }}
          path: apps/Aperture/Installer/Output/*.exe
          if-no-files-found: error
          # Seven days, not the default ninety: the release asset is the copy that lasts,
          # and five apps holding installers for a quarter is how a 500 MB account fills up.
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/aperture-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Get-ChildItem apps\Aperture\Installer\Output\*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName `
            --title "Aperture $env:VERSION" `
            --generate-notes
