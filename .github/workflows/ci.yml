# Tests every push to main.
#
# The installer workflows gate each release on the same suites, but they only
# run on a tag — so between releases nothing else checks main at all.
#
# Deliberately no packaging here: this answers "does main still work", and the
# installer workflows answer "can we ship it".
#
# GitHub-hosted runners only (docs/CI.md): the repository is public, and a
# self-hosted runner attached to a public repository runs whatever reaches a
# workflow on it. The images are pinned rather than -latest, so an image move is
# a change made here on purpose; the apt package names below are Ubuntu 24.04's.

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # The opposite of the release workflows: a newer push supersedes an older one,
  # because only the tip of main is interesting.
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No global.json: any 10.0 SDK builds the solution, so take the newest.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # external/XTerm.NET must be exactly upstream at the pinned commit plus
      # external/XTerm.NET.patches (docs/design/TERMINAL.md). A hand edit there would be lost at
      # the next update, so it fails here instead. It fetches one upstream commit, shallow.
      - name: Verify the vendored XTerm.NET
        shell: pwsh
        run: ./scripts/vendor-xterm-net.ps1 -Verify

      - name: Build solution
        run: dotnet build HultUI.slnx -c Release

      # The UI-automation tests (FlaUI) launch real sample windows and need a GPU
      # context, so they stay out of the automated pass. They gate themselves on
      # HULTUI_UITESTS, which nothing here sets, so they report as skipped —
      # same as the release workflows.
      - name: Run tests
        run: dotnet test HultUI.slnx -c Release --no-build

      # A golden-image mismatch leaves the frame, its baseline and a diff in
      # bin/**/golden-failures (GoldenImage.FailureDirectory) — what is needed to see what moved.
      - name: Upload golden-image failures
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-windows
          path: tests/**/bin/**/golden-failures/
          if-no-files-found: ignore
          retention-days: 7

  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tests that need a script's font skip without one, naming the package
      # ([HanFontsFact], [DevanagariFontsFact], [ColourEmojiFact]); Vesper's [SevenZipFact]
      # does the same for 7z. These make them run. Golden images bring their own DejaVu.
      - name: Install fonts and 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-dejavu-core fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji 7zip

      - name: Run tests
        run: dotnet test HultUI.CrossPlatform.slnf -c Release

      # A golden-image mismatch leaves the frame, its baseline and a diff in
      # bin/**/golden-failures (GoldenImage.FailureDirectory) — what is needed to see what moved.
      - name: Upload golden-image failures
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-linux
          path: tests/**/bin/**/golden-failures/
          if-no-files-found: ignore
          retention-days: 7

  # The API reference is generated from the XML docs, so a bad <see cref="..."/>
  # or a link to a page that moved is a build break here rather than a broken
  # published site. Nothing is deployed — see docs/PACKAGING.md for the
  # publishing decisions that are still open.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      # DocFX loads the source generator as an analyzer while reading metadata, and on a fresh
      # checkout there is no Release build of it to load. That raises FailedToResolveAnalyzer,
      # which --warningsAsErrors turns into a failed job — so this step is what makes the docs
      # build pass at all, not an optimisation.
      #
      # Only the analyzer, not the solution: DocFX builds everything else itself, and this takes
      # about a second where `dotnet build -c Release` (what the warning text suggests) would
      # spend minutes of runner time repeating work.
      - name: Build the source generator (DocFX loads it as an analyzer)
        run: dotnet build src/HultUI.SourceGenerators/HultUI.SourceGenerators.csproj -c Release

      - name: Build documentation
        run: dotnet docfx docfx.json --warningsAsErrors

      # The job exists for the warnings-as-errors build above; the site itself is a
      # convenience. Artifact storage is a small account-wide quota that fills, and a
      # full quota must not turn a clean docs build red.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: docs-site
          path: artifacts/docs
          retention-days: 3
