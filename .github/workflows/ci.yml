# Tests every push to main.
#
# The installer workflows gate each release on the same suites, but they only
# run on a tag — so between releases nothing was checking main at all. That gap
# existed because hosted Windows minutes were scarce; on self-hosted runners the
# builds are unmetered, so the net is back.
#
# Deliberately no packaging here: this answers "does main still work", and the
# installer workflows answer "can we ship it".

name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # The opposite of the release workflows: a newer push supersedes an older one,
  # because only the tip of main is interesting.
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v5

      - name: Build solution
        run: dotnet build HultUI.slnx -c Release

      # The UI-automation tests (FlaUI) launch real sample windows and need a GPU
      # context, so they stay out of the automated pass. They gate themselves on
      # HULTUI_UITESTS, which nothing here sets, so they report as skipped —
      # same as the release workflows.
      - name: Run tests
        run: dotnet test HultUI.slnx -c Release --no-build

  test-linux:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: dotnet test HultUI.CrossPlatform.slnf -c Release

  # The API reference is generated from the XML docs, so a bad <see cref="..."/>
  # or a link to a page that moved is a build break here rather than a broken
  # published site. Nothing is deployed — see docs/PACKAGING.md for the
  # publishing decisions that are still open.
  docs:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - name: Restore tools
        run: dotnet tool restore

      # DocFX loads the source generator as an analyzer while reading metadata, and on a fresh
      # checkout there is no Release build of it to load. That raises FailedToResolveAnalyzer,
      # which --warningsAsErrors turns into a failed job — so this step is what makes the docs
      # build pass at all, not an optimisation.
      #
      # Only the analyzer, not the solution: DocFX builds everything else itself, and this takes
      # about a second where `dotnet build -c Release` (what the warning text suggests) would
      # spend minutes of runner time repeating work.
      - name: Build the source generator (DocFX loads it as an analyzer)
        run: dotnet build src/HultUI.SourceGenerators/HultUI.SourceGenerators.csproj -c Release

      - name: Build documentation
        run: dotnet docfx docfx.json --warningsAsErrors

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: artifacts/docs
          retention-days: 7
