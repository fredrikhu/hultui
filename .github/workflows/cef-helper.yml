# Builds hultui-cef-helper (native/cef-helper/README.md) for linux-x64 and linux-arm64 and
# packs HultUI.WebView.Cef with both under runtimes/<rid>/native.
#
# The helper is forty lines of C that change only when its source does, so this runs on
# changes to it, on a cef-helper-v* tag, and by hand. A Linux build of the engine compiles its
# own machine's helper anyway; this is for a package that carries both architectures.
#
# Outputs go to a GitHub release through scripts/release-transport.sh, as mpv-natives.yml's
# do. A tag run uses the release for its tag, anything else a rolling "cef-helper-ci"
# prerelease whose assets are replaced each time.
#
# GitHub-hosted runners only (docs/CI.md). linux-arm64 is cross-compiled with Ubuntu's
# gcc-aarch64-linux-gnu, installed below.

name: cef helper

on:
  push:
    paths: ['native/cef-helper/**', 'src/HultUI.WebView.Cef/HultUI.WebView.Cef.csproj']
    tags: ['cef-helper-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cef-helper-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/cef-helper-v') && github.ref_name || 'cef-helper-ci' }}
  RELEASE_KIND: ${{ startsWith(github.ref, 'refs/tags/cef-helper-v') && '' || '--prerelease' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # the helpers and the package go to the release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install the arm64 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build linux-x64
        run: native/cef-helper/build.sh linux-x64

      - name: Build linux-arm64
        run: native/cef-helper/build.sh linux-arm64 aarch64-linux-gnu-gcc

      # Tag cef-helper-v1.2.0 -> 1.2.0; anything else gets a prerelease stamp. The version
      # reaches a command line below, so a tag that does not hold one stops here.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cef-helper-v* ]]; then
            version=${GITHUB_REF#refs/tags/cef-helper-v}
          else
            version=0.0.0-ci.$GITHUB_RUN_NUMBER
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Not a version: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack HultUI.WebView.Cef
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/HultUI.WebView.Cef/HultUI.WebView.Cef.csproj -c Release -o artifacts/packages "-p:Version=$VERSION"

      - name: Publish the helpers and the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-transport.sh ensure "$RELEASE_TAG" $RELEASE_KIND
          for rid in linux-x64 linux-arm64; do
            f=native/cef-helper/out/$rid/hultui-cef-helper
            [ -f "$f" ] && bash scripts/release-transport.sh upload "$RELEASE_TAG" "$f" "hultui-cef-helper-$rid"
          done
          for f in artifacts/packages/*.nupkg; do
            bash scripts/release-transport.sh upload "$RELEASE_TAG" "$f" "$(basename "$f")"
          done
