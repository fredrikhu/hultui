# Builds the Vesper Commander Windows installer.
#
# Runs on release tags only. Pushing a tag like `vesper-v1.2.0` builds the
# installer and publishes a GitHub Release with it attached.
#
# Runs on self-hosted runners (see docs/SELF-HOSTED-RUNNERS.md), so the machines
# have to be awake for a queued job to start. Kept to tags rather than every
# push from when these were hosted Windows runners, which bill at twice the
# minute rate and exhausted a month's free allowance in nine days. Use
# `workflow_dispatch` for an off-tag build — it still produces a CI-versioned
# installer as an artifact, without publishing a release.

name: Vesper Commander installer

on:
  push:
    tags: ['vesper-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vesper-installer-${{ github.ref }}
  # Never cancelled: every run is now either a release tag or a deliberate
  # manual build, and neither is worth superseding.
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v5

      # No actions/setup-dotnet: the SDK is provisioned on the runner itself
      # (Windows: C:\Program Files\dotnet on the machine PATH; the Linux
      # container: dotnet-sdk-10.0 from the Ubuntu archive). The action would
      # try to install into that same Program Files directory, which the
      # runner's NETWORK SERVICE account cannot write to — it exits 1 and
      # every step after it is skipped.

      - name: Build app (Release)
        run: dotnet build apps/VesperCommander/VesperCommander.csproj -c Release

      - name: Run tests
        run: dotnet test tests/VesperCommander.Tests/VesperCommander.Tests.csproj -c Release

      # Vesper renders through HultUI's Skia pipeline, so a framework render
      # regression can crash the app even when VesperCommander's own tests pass.
      # These headless tests exercise real render passes and gate the release on
      # them (a shipped 1.0.0 carried an unguarded spanned-DrawText NRE that only
      # the full-solution CI caught — this closes that gap for Vesper's pipeline).
      - name: Run framework render tests (headless)
        run: dotnet test tests/HultUI.Headless.Tests/HultUI.Headless.Tests.csproj -c Release

  installer:
    needs: test
    runs-on: [self-hosted, windows, x64]
    permissions:
      contents: write # for the release step on tag builds
    steps:
      - uses: actions/checkout@v5

      # No actions/setup-dotnet: the SDK is provisioned on the runner itself
      # (Windows: C:\Program Files\dotnet on the machine PATH; the Linux
      # container: dotnet-sdk-10.0 from the Ubuntu archive). The action would
      # try to install into that same Program Files directory, which the
      # runner's NETWORK SERVICE account cannot write to — it exits 1 and
      # every step after it is skipped.

      # Tag vesper-v1.2.0 -> 1.2.0; other builds get a CI prerelease version.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/vesper-v*') {
            $version = $env:GITHUB_REF_NAME.Substring('vesper-v'.Length)
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $version"

      # Native AOT publish (PublishAot is set in the csproj); the runner image
      # includes the required MSVC toolchain.
      - name: Publish Vesper Commander (win-x64, AOT)
        run: dotnet publish apps/VesperCommander/VesperCommander.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.version }}

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" apps\VesperCommander\Installer\vesper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VesperCommander-Setup-${{ steps.version.outputs.version }}
          path: apps/VesperCommander/Installer/Output/*.exe
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/vesper-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem apps\VesperCommander\Installer\Output\*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName `
            --title "Vesper Commander ${{ steps.version.outputs.version }}" `
            --generate-notes
