# Builds the Vesper Commander Windows installer.
#
# Runs on release tags only. Pushing a tag like `vesper-v1.2.0` builds the
# installer and publishes a GitHub Release with it attached. Push at most three
# tags in one `git push`: GitHub fires no push events for a larger one, so no
# release starts (recover with `gh workflow run vesper-installer.yml --ref <tag>`).
#
# GitHub-hosted runners only (docs/CI.md). Use `workflow_dispatch` for an off-tag
# build — it still produces a CI-versioned installer as an artifact, without
# publishing a release.

name: Vesper Commander installer

on:
  push:
    tags: ['vesper-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vesper-installer-${{ github.ref }}
  # Never cancelled: every run is either a release tag or a deliberate manual
  # build, and neither is worth superseding.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build app (Release)
        run: dotnet build apps/VesperCommander/VesperCommander.csproj -c Release

      - name: Run tests
        run: dotnet test tests/VesperCommander.Tests/VesperCommander.Tests.csproj -c Release

      # Vesper renders through HultUI's Skia pipeline, so a framework render
      # regression can crash the app even when VesperCommander's own tests pass.
      # These headless tests exercise real render passes and gate the release on
      # them (a shipped 1.0.0 carried an unguarded spanned-DrawText NRE that only
      # the full-solution CI caught — this closes that gap for Vesper's pipeline).
      - name: Run framework render tests (headless)
        run: dotnet test tests/HultUI.Headless.Tests/HultUI.Headless.Tests.csproj -c Release

  installer:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write # for the release step on tag builds
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Tag vesper-v1.2.0 -> 1.2.0; other builds get a CI prerelease version. The
      # version reaches command lines below, so a tag that does not hold one stops here.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/vesper-v*') {
            $version = $env:GITHUB_REF_NAME.Substring('vesper-v'.Length)
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $version"

      # Native AOT publish (PublishAot is set in the csproj); the runner image
      # includes the required MSVC toolchain.
      - name: Publish Vesper Commander (win-x64, AOT)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish apps/VesperCommander/VesperCommander.csproj -c Release -r win-x64 "-p:Version=$env:VERSION"

      - name: Compile installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" apps\VesperCommander\Installer\vesper.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A convenience copy: the release step attaches the installer from the workspace, so a
      # failed upload (the account's artifact quota) must not stop it.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: VesperCommander-Setup-${{ steps.version.outputs.version }}
          path: apps/VesperCommander/Installer/Output/*.exe
          if-no-files-found: error
          # Seven days, not the default ninety: the release asset is the copy that lasts,
          # and five apps holding installers for a quarter is how a 500 MB account fills up.
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/vesper-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Get-ChildItem apps\VesperCommander\Installer\Output\*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName `
            --title "Vesper Commander $env:VERSION" `
            --generate-notes
