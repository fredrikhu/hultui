# Builds the Junction Windows installer.
#
# Runs on release tags only. Pushing a tag like `junction-v1.2.0` builds the
# installer and publishes a GitHub Release with it attached. Push at most three
# tags in one `git push`: GitHub fires no push events for a larger one, so no
# release starts (recover with `gh workflow run junction-installer.yml --ref <tag>`).
#
# GitHub-hosted runners only (docs/CI.md). Use `workflow_dispatch` for an off-tag
# build — it still produces a CI-versioned installer as an artifact, without
# publishing a release.

name: Junction installer

on:
  push:
    tags: ['junction-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: junction-installer-${{ github.ref }}
  # Never cancelled: every run is either a release tag or a deliberate manual
  # build, and neither is worth superseding.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build HultUI.slnx -c Release

      # The UI-automation tests (FlaUI) launch real SDL sample windows, which
      # need a GPU context the hosted runner's Basic Render Driver can't
      # provide — the samples exit at startup there. They gate themselves on
      # HULTUI_UITESTS, which nothing here sets, so they report as skipped.
      - name: Run tests
        run: dotnet test HultUI.slnx -c Release --no-build

  # Proves the framework is display-free on Linux: the headless tests run full
  # app scenarios (render, input, accessibility queries) with no X11/Wayland
  # and no GPU. Uses the solution filter, which excludes the Windows-only
  # HultUI.UiTests — testing each project separately instead would rebuild the
  # shared graph once per project.
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # As in ci.yml: the font- and 7z-gated tests skip without these, naming the package.
      - name: Install fonts and 7-Zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-dejavu-core fonts-noto-cjk fonts-noto-core fonts-noto-color-emoji 7zip

      - name: Run tests
        run: dotnet test HultUI.CrossPlatform.slnf -c Release

  installer:
    needs: [test, test-linux]
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write # for the release step on tag builds
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Tag junction-v1.2.0 -> 1.2.0; other builds get a CI prerelease version. The
      # version reaches command lines below, so a tag that does not hold one stops here.
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/junction-v*') {
            $version = $env:GITHUB_REF_NAME.Substring('junction-v'.Length)
          } else {
            $version = "0.1.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Not a version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Installer version: $version"

      # Native AOT publish (PublishAot is set in the csproj); the runner image
      # includes the required MSVC toolchain.
      - name: Publish Junction (win-x64, AOT)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish apps/Junction/Junction.csproj -c Release -r win-x64 "-p:Version=$env:VERSION"

      - name: Compile installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" apps\Junction\Installer\junction.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A convenience copy: the release below attaches the installer from the workspace, so
      # a failed upload (the account's artifact quota, hit on 2026-09-13) must not stop it.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: Junction-Setup-${{ steps.version.outputs.version }}
          path: apps/Junction/Installer/Output/*.exe
          if-no-files-found: error
          # Seven days, not the default ninety: the release asset is the copy that lasts,
          # and five apps holding installers for a quarter is how a 500 MB account fills up.
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/junction-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Get-ChildItem apps\Junction\Installer\Output\*.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $exe.FullName `
            --title "Junction $env:VERSION" `
            --generate-notes
